<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statue to Person AI Transformer</title>
    <style>
        :root {
            --bg: #070709;
            --card: #121216;
            --gold: #FFD700;
            --gold-dim: rgba(255, 215, 0, 0.15);
            --border: #2a2a32;
            --text: #f0f0f5;
            --muted: #8e8e9e;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: var(--card);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 800px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        }
        h2 {
            margin: 0 0 6px;
            color: var(--gold);
            letter-spacing: 0.8px;
            font-size: 1.55rem;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            margin: 0 0 20px;
        }
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        @media (max-width: 600px) {
            .grid-inputs { grid-template-columns: 1fr; }
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--gold);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #09090c;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold);
        }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            background: #0b0b0f;
            transition: all 0.25s;
            margin-bottom: 14px;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--gold);
            background: var(--gold-dim);
        }
        .upload-zone img {
            max-height: 210px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--gold);
            display: none;
        }
        .api-bar {
            background: #0b0b0f;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .api-row {
            display: flex;
            gap: 8px;
        }
        .api-row input { flex: 1; }
        .small-btn {
            background: #1d1d24;
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .small-btn:hover { background: var(--gold); color: #000; }
        .primary-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #FFD700, #e6b800);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            margin-top: 6px;
        }
        .primary-btn:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.95; }
        .primary-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        
        .status-box {
            margin: 16px 0 0;
            font-size: 13px;
            color: var(--gold);
            text-align: center;
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--gold-dim);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .prompt-editor {
            margin-top: 14px;
            display: none;
        }
        .result-box {
            margin-top: 24px;
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }
        @media (max-width: 600px) {
            .comparison-grid { grid-template-columns: 1fr; }
        }
        .img-frame {
            background: #09090c;
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .img-frame.highlight {
            border-color: var(--gold);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.18);
        }
        .img-frame span {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .img-frame.highlight span { color: var(--gold); }
        .img-frame img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }
        .action-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .action-row { grid-template-columns: 1fr; }
        }
        .action-btn {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--gold);
            background: #18181f;
            color: var(--gold);
            transition: 0.2s;
        }
        .action-btn:hover { background: var(--gold); color: #000; }
        .action-btn.secondary { border-color: #444; color: #aaa; }
        .action-btn.secondary:hover { background: #333; color: #fff; }
        footer {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Statue to Person AI</h2>
    <p class="subtitle">Locks the exact posture, hand mudras, dress &amp; ornaments of the original statue in living form.</p>

    <!-- Groq Vision Key for Exact Posture, Dress & Ornament Extraction -->
    <div class="api-bar">
        <label for="groqKey">Groq API Key (Required to scan exact posture, dress &amp; ornaments from statue)</label>
        <div class="api-row">
            <input type="password" id="groqKey" placeholder="gsk_... (Saved locally in browser)">
            <button type="button" id="saveKeyBtn" class="small-btn">Save Key</button>
        </div>
    </div>

    <!-- Drag & Drop Upload with Instant Preview -->
    <div class="upload-zone" id="dropZone">
        <input type="file" id="photoInput" accept="image/*" hidden>
        <div id="uploadText">
            <strong style="color: var(--gold);">Click to upload statue photo</strong> or drag &amp; drop here<br>
            <span style="font-size: 11px; color: var(--muted);">Supports JPG, PNG, WEBP</span>
        </div>
        <img id="previewImg" alt="Uploaded Statue Preview">
    </div>

    <div class="grid-inputs">
        <div>
            <label for="genderSelect">Subject Identity</label>
            <select id="genderSelect">
                <option value="auto">Auto-Detect from Statue</option>
                <option value="South Indian man">Male Statue</option>
                <option value="South Indian woman">Female Statue</option>
            </select>
        </div>
        <div>
            <label for="poseLockSelect">Posture &amp; Camera Angle</label>
            <select id="poseLockSelect">
                <option value="strict">Strict Anatomical Posture &amp; Angle Lock (Exact Match)</option>
                <option value="relaxed">Exact Pose with Natural Human Micro-Relaxation</option>
            </select>
        </div>
        <div>
            <label for="materialSelect">Ornament &amp; Fabric Material</label>
            <select id="materialSelect">
                <option value="real antique burnished gold jewelry with rubies and pearls, woven handloom silk and cotton garments">Real Gold &amp; Handloom Silk (Default)</option>
                <option value="real aged bronze-gold temple ornaments and natural raw silk draping">Aged Temple Gold &amp; Raw Silk</option>
                <option value="exact matching materials, colors, and textures visible on the original statue">Strict Match to Statue Colors</option>
            </select>
        </div>
        <div>
            <label for="aspectSelect">Output Framing &amp; Resolution</label>
            <select id="aspectSelect">
                <option value="auto">Auto-Match Statue Aspect Ratio (Recommended)</option>
                <option value="768x1152">Full-Body Portrait (2:3 HD)</option>
                <option value="768x1344">Tall Full-Length (9:16 HD)</option>
                <option value="1024x1024">Square Shot (1:1 HD)</option>
            </select>
        </div>
    </div>

    <button id="transformBtn" class="primary-btn">EXTRACT POSTURE, DRESS &amp; TRANSFORM</button>

    <div class="status-box">
        <div class="spinner" id="spinner"></div>
        <span id="status">Upload a statue image to begin...</span>
    </div>

    <!-- Editable Extracted Description -->
    <div class="prompt-editor" id="promptEditorBox">
        <label for="editablePrompt">Extracted Posture, Dress &amp; Ornaments (Editable — Refine if needed)</label>
        <textarea id="editablePrompt" rows="4"></textarea>
    </div>

    <!-- Side-by-Side Result Area -->
    <div id="resultArea" class="result-box">
        <div class="comparison-grid">
            <div class="img-frame">
                <span>ORIGINAL STATUE</span>
                <img id="compareOriginal" alt="Original Statue">
            </div>
            <div class="img-frame highlight">
                <span>LIVING PORTRAIT RENDER</span>
                <img id="outputImg" crossorigin="anonymous" alt="Reimagined Portrait">
            </div>
        </div>

        <div class="action-row">
            <button id="dlBtn" class="action-btn">Download High-Res PNG</button>
            <button id="regenBtn" class="action-btn secondary">Re-Roll Seed</button>
            <button id="resetBtn" class="action-btn secondary">New Statue</button>
        </div>
    </div>
</div>

<footer>Designed by Thiraviya Kumar G</footer>

<script>
    const photoInput = document.getElementById('photoInput');
    const dropZone = document.getElementById('dropZone');
    const previewImg = document.getElementById('previewImg');
    const uploadText = document.getElementById('uploadText');
    const groqKeyInput = document.getElementById('groqKey');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const transformBtn = document.getElementById('transformBtn');
    const regenBtn = document.getElementById('regenBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dlBtn = document.getElementById('dlBtn');
    const statusText = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const promptEditorBox = document.getElementById('promptEditorBox');
    const editablePrompt = document.getElementById('editablePrompt');
    const resultArea = document.getElementById('resultArea');
    const compareOriginal = document.getElementById('compareOriginal');
    const outputImg = document.getElementById('outputImg');

    let uploadedDataUrl = null;
    let detectedDimensions = { width: 768, height: 1152 };

    // Load saved Groq API key
    const savedKey = localStorage.getItem('gtk_groq_api_key');
    if (savedKey) groqKeyInput.value = savedKey;

    saveKeyBtn.onclick = () => {
        const key = groqKeyInput.value.trim();
        if (key) {
            localStorage.setItem('gtk_groq_api_key', key);
            setStatus("API key saved in browser.", false);
        } else {
            localStorage.removeItem('gtk_groq_api_key');
            setStatus("API key cleared.", false);
        }
    };

    // Drag & Drop + File Selection
    dropZone.onclick = () => photoInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    };
    photoInput.onchange = (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
    };

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            return setStatus("Please upload a valid image file.", false);
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            const tempImg = new Image();
            tempImg.onload = () => {
                // Compute matching HD render dimensions (multiples of 64)
                const ratio = tempImg.width / tempImg.height;
                if (ratio < 0.65) {
                    detectedDimensions = { width: 768, height: 1344 }; // Tall 9:16
                } else if (ratio < 0.88) {
                    detectedDimensions = { width: 768, height: 1152 }; // Portrait 2:3
                } else if (ratio <= 1.15) {
                    detectedDimensions = { width: 1024, height: 1024 }; // Square 1:1
                } else {
                    detectedDimensions = { width: 1152, height: 768 }; // Landscape 3:2
                }

                const canvas = document.createElement('canvas');
                const maxDim = 896;
                let w = tempImg.width, h = tempImg.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                    else { w = Math.round(w * maxDim / h); h = maxDim; }
                }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(tempImg, 0, 0, w, h);
                uploadedDataUrl = canvas.toDataURL('image/jpeg', 0.9);

                previewImg.src = uploadedDataUrl;
                previewImg.style.display = 'inline-block';
                uploadText.innerHTML = `<span style="color:var(--gold);">Statue image loaded!</span> (${detectedDimensions.width}x${detectedDimensions.height} matched) — Click to change.`;
                setStatus("Ready to extract posture, dress & ornaments.", false);
            };
            tempImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function setStatus(msg, loading = false) {
        statusText.innerText = msg;
        spinner.style.display = loading ? 'inline-block' : 'none';
    }

    // Step 1: Strictly Inventory Posture, Mudras, Dress & Ornaments via Groq Vision
    async function extractExactStatueDetails(dataUrl, selectedGender, materialStyle, poseLock) {
        const apiKey = groqKeyInput.value.trim();
        if (!apiKey) return null;

        const visionModels = [
            "llama-3.2-90b-vision-preview",
            "llama-3.2-11b-vision-preview"
        ];

        const poseGuidance = poseLock === 'strict'
            ? "Describe the EXACT geometric body posture, spine flexion (e.g., tribhanga S-curve or straight samabhanga), head tilt angle, gaze direction, exact left arm and right arm positions, elbow bends, exact finger mudras/hand gestures, hip weight shift, and exact leg/foot stance or seated cross-legged position, plus the exact camera framing (full-body head-to-toe, three-quarter, or bust) and angle."
            : "Preserve the exact stance, arm gestures, hand mudras, and head orientation of the statue while letting the posture look naturally balanced for a living human.";

        const systemInstruction = `Inspect this statue image with extreme precision and write a 115-word photorealistic image-generation prompt transforming this exact statue into a living, breathing human being. You MUST preserve the EXACT posture, EXACT dress, and EXACT ornaments of the statue without inventing or adding extra clothes.

Include in one cohesive paragraph:
1. Framing & Subject: Exact framing (full-body head-to-feet if feet are visible, or matching crop) of ${selectedGender === 'auto' ? 'the exact gender, age, and build shown in the statue' : selectedGender}.
2. Exact Posture & Mudras: ${poseGuidance}
3. Exact Headgear & Ornaments: Exact crown (karanda/kirita makuta) or hair bun, ear ornaments (kundala), every necklace (haram, choker), armlets (keyura), bangles, sacred thread (yajnopavita), waist belt (udarabandha/mekhala), and anklets.
4. Exact Dress & Draping: Exact cut, pleats, belt folds, and coverage of upper and lower garments (keep torso bare with ornaments if the statue's torso is bare), rendered in ${materialStyle}.
5. Setting: Matching subtle temple stone or historical background with natural daylight.

Output ONLY the prompt text. No labels, no bullet points, no markdown.`;

        for (const model of visionModels) {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: systemInstruction },
                                { type: "image_url", image_url: { url: dataUrl } }
                            ]
                        }],
                        temperature: 0.15, // Very low temperature for strict anatomical & outfit fidelity
                        max_tokens: 250
                    })
                });
                if (!res.ok) continue;
                const data = await res.json();
                const text = data.choices?.[0]?.message?.content?.trim();
                if (text) return text;
            } catch (err) {
                console.warn(`Vision fallback from ${model}:`, err);
            }
        }
        return null;
    }

    // Step 2: Render Image via Pollinations Flux
    function renderImageFromPrompt(promptText) {
        const aspectChoice = document.getElementById('aspectSelect').value;
        const [width, height] = aspectChoice === 'auto'
            ? [detectedDimensions.width, detectedDimensions.height]
            : aspectChoice.split('x');

        const seed = Math.floor(Math.random() * 999999);

        const realismTags = "RAW candid photograph, real living human flesh and natural skin pores, expressive lifelike eyes, faithful reproduction of the exact body posture, hand gestures, ornaments, and garment draping, natural daylight, 8k resolution, sharp focus, anatomically accurate hands with five fingers, completely transformed from stone/metal into real human skin and real fabric";
        const fullPrompt = `${promptText}, ${realismTags}`;
        const encoded = encodeURIComponent(fullPrompt);

        const url = `https://image.pollinations.ai/prompt/${encoded}?width=${width}&height=${height}&seed=${seed}&model=flux&nologo=true&enhance=false`;

        setStatus("Rendering living portrait matching posture, dress & ornaments...", true);
        transformBtn.disabled = true;
        regenBtn.disabled = true;

        const loader = new Image();
        loader.crossOrigin = "anonymous";
        loader.onload = () => {
            compareOriginal.src = uploadedDataUrl;
            outputImg.src = url;
            resultArea.style.display = "block";
            setStatus("Transformation Complete!", false);
            transformBtn.disabled = false;
            regenBtn.disabled = false;
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
        loader.onerror = () => {
            setStatus("Render server busy. Click 'Re-Roll Seed' to retry.", false);
            transformBtn.disabled = false;
            regenBtn.disabled = false;
        };
        loader.src = url;
    }

    // Main Transform Click
    transformBtn.onclick = async () => {
        if (!uploadedDataUrl) {
            return setStatus("Please upload a statue photo first!", false);
        }

        const gender = document.getElementById('genderSelect').value;
        const poseLock = document.getElementById('poseLockSelect').value;
        const material = document.getElementById('materialSelect').value;

        if (!groqKeyInput.value.trim()) {
            setStatus("Tip: Add your Groq API key above so the AI can copy the statue's exact posture, dress & ornaments.", false);
        }

        transformBtn.disabled = true;
        let finalPrompt = "";

        if (groqKeyInput.value.trim()) {
            setStatus("Scanning exact posture, hand mudras, dress & jewelry...", true);
            const visionPrompt = await extractExactStatueDetails(uploadedDataUrl, gender, material, poseLock);
            if (visionPrompt) {
                finalPrompt = visionPrompt;
            }
        }

        if (!finalPrompt) {
            const subject = gender === 'auto' ? 'South Indian historical figure' : gender;
            finalPrompt = `Full-length living breathing portrait of a ${subject} holding the exact stance, head tilt, and hand mudras of the statue, wearing the exact traditional ornaments, crown, waist belt, and pleated garment draping, rendered in ${material}`;
        }

        editablePrompt.value = finalPrompt;
        promptEditorBox.style.display = "block";
        renderImageFromPrompt(finalPrompt);
    };

    // Re-roll using the edited prompt
    regenBtn.onclick = () => {
        const customPrompt = editablePrompt.value.trim();
        if (customPrompt) renderImageFromPrompt(customPrompt);
    };

    // CORS-safe PNG Download
    dlBtn.onclick = () => {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = outputImg.naturalWidth;
            canvas.height = outputImg.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(outputImg, 0, 0);

            const link = document.createElement('a');
            link.download = `Statue_Alive_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (e) {
            window.open(outputImg.src, '_blank');
        }
    };

    resetBtn.onclick = () => {
        uploadedDataUrl = null;
        photoInput.value = "";
        previewImg.style.display = "none";
        resultArea.style.display = "none";
        promptEditorBox.style.display = "none";
        uploadText.innerHTML = `<strong style="color: var(--gold);">Click to upload statue photo</strong> or drag &amp; drop here<br><span style="font-size: 11px; color: var(--muted);">Supports JPG, PNG, WEBP</span>`;
        setStatus("Ready for a new statue.", false);
    };
</script>

</body>
</html>
